<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · OptionEdge AI</title><style>:root{--bg:#071019;--panel:#0b1621;--line:#1b2e3d;--text:#edf6fb;--muted:#839aaa;--accent:#6ee7b7}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 50% 0,#10283a 0,#071019 45%);color:var(--text);font:14px Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(420px,100%);background:rgba(11,22,33,.96);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;margin-bottom:24px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#12302d,#0c2737);border:1px solid #294558;display:grid;place-items:center;color:var(--accent);font-weight:950}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:850}.title{font-size:25px;font-weight:850;margin:5px 0}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}input,button{width:100%;height:46px;border-radius:10px;font:inherit}input{border:1px solid #294052;background:#071019;color:#edf6fb;padding:0 13px;margin-bottom:10px}button{border:0;background:var(--accent);color:#041016;font-weight:900;cursor:pointer}button.alt{margin-top:10px;background:transparent;color:#94aab8;border:1px solid #294052}.msg{min-height:20px;margin:12px 0 0;color:#9bb0bd;font-size:12px}.msg.err{color:#ff9696}.hidden{display:none!important}</style></head>
<body><main class="panel"><div class="brand"><div class="logo">O</div><span>OptionEdge AI</span></div><div class="eyebrow">Private quantitative terminal</div><div class="title">Sign in</div><div class="sub">Passwordless email sign-in. Your strategy configurations and research stay isolated to your account.</div><form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required><input id="code" class="hidden" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"><button id="submit">Continue</button><button id="back" class="alt hidden" type="button">Use a different email</button></form><div id="passkey" class="hidden"><p class="sub" style="margin:14px 0">Add a passkey for faster sign-in next time.</p><button id="add">Add a passkey</button><button id="skip" class="alt">Not now</button></div><div id="msg" class="msg"></div></main>
<script>(function(){const A=window.hatchable?.auth;if(!A)return;const $=id=>document.getElementById(id);let step='email',hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};function say(t,e){$('msg').textContent=t||'';$('msg').className='msg '+(e?'err':'')}async function finish(){if(!hasPasskey&&A.supportsPasskeys?.()&&localStorage.getItem('optionedge_passkey_offer')!=='1'){ $('form').classList.add('hidden');$('passkey').classList.remove('hidden');say('');return}location.replace(next())}A.getSession().then(s=>{if(s?.user)location.replace(next())}).catch(()=>{});$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){const email=$('email').value.trim();const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys?.()){try{const d=await A.signInWithPasskey({email});if(d?.user)return location.replace(next())}catch(_){}}step='code';$('code').classList.remove('hidden');$('email').readOnly=true;$('back').classList.remove('hidden');$('submit').textContent='Sign in';say('Code sent. Enter the 6-digit code.')}else{const d=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(d?.user)await finish()}}catch(err){say(err?.message||'Sign-in failed. Please try again.',true)}$('submit').disabled=false};$('back').onclick=()=>location.reload();$('add').onclick=async()=>{try{await A.registerPasskey();localStorage.setItem('optionedge_passkey_offer','1');location.replace(next())}catch(e){say(e?.message||'Could not add passkey.',true)}};$('skip').onclick=()=>{localStorage.setItem('optionedge_passkey_offer','1');location.replace(next())}})()</script></body></html>
