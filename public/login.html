<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · OptionEdge AI</title><style>:root{--bg:#071019;--panel:#0e1b28;--line:#1b2e3d;--text:#edf6fb;--muted:#7f97a8;--accent:#6ee7b7;--danger:#ff9b9b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#102335 0,#071019 45%);color:var(--text);font:14px Inter,system-ui,sans-serif}.card{width:min(430px,calc(100% - 32px));border:1px solid var(--line);background:linear-gradient(180deg,#0e1b28,#08131d);border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}.logo{width:36px;height:36px;border-radius:12px;border:1px solid #294558;background:#0c2737;color:var(--accent);display:grid;place-items:center}.eyebrow{margin-top:28px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.title{font-size:28px;font-weight:900;margin:7px 0}.sub{color:var(--muted);line-height:1.55;margin-bottom:22px}label{display:block;color:#91a8b7;font-size:10px;font-weight:800;text-transform:uppercase;margin:0 0 7px}input{width:100%;height:46px;border:1px solid #294052;border-radius:10px;background:#071019;color:var(--text);padding:0 13px;outline:none;font-size:15px}input:focus{border-color:#4b7690}.button{width:100%;height:46px;border:1px solid #294052;border-radius:10px;background:#122332;color:#cfe0e8;font-weight:850;cursor:pointer;margin-top:10px}.primary{background:var(--accent);color:#041016;border-color:transparent}.ghost{background:transparent}.msg{min-height:22px;margin:14px 0 0;color:var(--muted);line-height:1.5}.msg.err{color:var(--danger)}.hidden{display:none!important}.back{margin-top:8px}</style></head><body><main class="card"><div class="brand"><div class="logo">O</div><span>OptionEdge AI</span></div><div class="eyebrow">Secure terminal access</div><div class="title" id="title">Sign in</div><div class="sub" id="sub">Enter your email and we'll send a one-time verification code. No password is required.</div><form id="form"><div id="emailWrap"><label for="email">Email</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required></div><div id="codeWrap" class="hidden"><label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button class="button primary" id="submit" type="submit">Continue</button><button class="button ghost back hidden" id="back" type="button">Use a different email</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div></main><script>(function(){const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id),next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};if(!A){$('msg').textContent='Authentication is not available. Please refresh.';return}A.getSession().then(s=>{if(s&&s.user)location.replace(next())}).catch(()=>{});let step='email';$('email').focus();$('form').onsubmit=async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;$('msg').className='msg';try{if(step==='email'){const email=$('email').value.trim();if(!email)throw Error('Enter your email address.');const r=await A.startLogin({email});step='code';$('emailWrap').classList.add('hidden');$('codeWrap').classList.remove('hidden');$('back').classList.remove('hidden');$('submit').textContent='Sign in';$('sub').textContent='Enter the 6-digit code sent to '+email+'.';$('msg').textContent=r&&r.has_passkey?'Code sent. You can also use your saved passkey from the email field.':'Code sent. It expires in 10 minutes.';$('code').focus()}else{const d=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(!d||!d.user)throw Error('Verification failed.');location.replace(next())}}catch(err){$('msg').className='msg err';$('msg').textContent=err&&err.status===429?'Too many attempts. Please wait a moment.':(err.message||'Sign-in failed.')}finally{btn.disabled=false}};$('back').onclick=()=>{step='email';$('emailWrap').classList.remove('hidden');$('codeWrap').classList.add('hidden');$('back').classList.add('hidden');$('submit').textContent='Continue';$('sub').textContent="Enter your email and we'll send a one-time verification code. No password is required.";$('msg').textContent='';$('email').focus()}})();</script></body></html>
