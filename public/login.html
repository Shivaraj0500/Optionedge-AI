<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · OptionEdge AI</title>
<style>
:root{--bg:#071019;--panel:#0b1621;--line:#1b2e3d;--text:#edf6fb;--muted:#7f97a8;--accent:#6ee7b7;--danger:#ff9b9b}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#102335 0,#071019 48%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.card{width:min(430px,calc(100% - 32px));padding:30px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(14,27,40,.97),rgba(8,18,28,.97));box-shadow:0 20px 60px rgba(0,0,0,.3)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}.logo{width:36px;height:36px;border:1px solid #294558;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#12302d,#0c2737);color:var(--accent);font-weight:950}.eyebrow{margin-top:28px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{font-size:27px;font-weight:900;margin:7px 0}.sub{color:var(--muted);line-height:1.55;margin:0 0 22px}label{display:block;color:#91a8b7;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}input{width:100%;height:46px;border:1px solid #294052;border-radius:10px;background:#071019;color:var(--text);padding:0 13px;outline:none}input:focus{border-color:#4b7690}button{width:100%;height:46px;margin-top:12px;border:1px solid #294052;border-radius:10px;background:var(--accent);color:#041016;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.alt{background:transparent;color:#cfe0e8}.msg{min-height:20px;margin:14px 0 0;color:var(--muted);line-height:1.45}.msg.err{color:var(--danger)}.security{margin-top:20px;padding-top:16px;border-top:1px solid #182a38;color:#708897;font-size:10px;line-height:1.5}.hidden{display:none!important}
</style></head>
<body><main class="card"><div class="brand"><div class="logo">O</div><span>OptionEdge AI</span></div><div class="eyebrow">Private quantitative terminal</div><div id="title" class="title">Sign in</div><p id="sub" class="sub">Use your email to receive a one-time verification code. No password is required.</p>
<form id="form"><div id="emailRow"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="you@example.com"></div><div id="codeRow" class="hidden"><label for="code">Verification code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="6-digit code"></div><button id="submit" type="submit">Continue</button><button id="back" class="alt hidden" type="button">Use a different email</button></form>
<div id="passkey" class="hidden"><button id="addPasskey" type="button">Add a passkey</button><button id="skipPasskey" class="alt" type="button">Not now</button></div><p id="msg" class="msg" role="status" aria-live="polite"></p><div class="security">Your session is managed by Hatchable's passwordless authentication. OptionEdge AI never stores your password or verification code.</div></main>
<script>
(function(){
  var A=window.hatchable&&window.hatchable.auth, form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailRow=document.getElementById('emailRow'),codeRow=document.getElementById('codeRow'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),title=document.getElementById('title'),passkey=document.getElementById('passkey'),add=document.getElementById('addPasskey'),skip=document.getElementById('skipPasskey');
  var step='email',hasPasskey=false;
  function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}
  function next(){var n=new URLSearchParams(location.search).get('next')||'/';if(n.charAt(0)!=='/'||n.indexOf('//')===0)n='/';return n}
  function go(){location.replace(next())}
  function declined(){try{return localStorage.getItem('passkey_offer_declined')==='1'}catch(e){return false}}
  function decline(){try{localStorage.setItem('passkey_offer_declined','1')}catch(e){}}
  if(!A){say('Authentication is unavailable. Please refresh the page.',true);submit.disabled=true;return}
  A.getSession().then(function(s){if(s&&s.user)go()}).catch(function(){});
  if(A.attachPasskeyAutofill){try{A.attachPasskeyAutofill(email).then(function(r){if(r&&r.user)go()}).catch(function(){})}catch(e){}}
  function finish(){if(hasPasskey||declined()||!A.registerPasskey||!A.supportsPasskeys||!A.supportsPasskeys()){go();return}form.classList.add('hidden');passkey.classList.remove('hidden');title.textContent="You're signed in";sub.textContent='Add a passkey for faster sign-in next time using your fingerprint, face, or screen lock.';say('')}
  back.onclick=function(){step='email';emailRow.classList.remove('hidden');codeRow.classList.add('hidden');back.classList.add('hidden');submit.textContent='Continue';sub.textContent='Use your email to receive a one-time verification code. No password is required.';say('');email.focus()};
  form.onsubmit=function(e){e.preventDefault();submit.disabled=true;say('');if(step==='email'){var em=email.value.trim();if(!em){submit.disabled=false;say('Enter your email address.',true);return}A.startLogin({email:em}).then(function(r){hasPasskey=!!(r&&r.has_passkey);if(hasPasskey&&A.supportsPasskeys&&A.supportsPasskeys())return A.signInWithPasskey({email:em}).then(function(d){if(d&&d.user){go();return null}return 'code'}).catch(function(){return 'code'});return 'code'}).then(function(x){if(x!=='code')return;step='code';emailRow.classList.add('hidden');codeRow.classList.remove('hidden');back.classList.remove('hidden');submit.textContent='Sign in';sub.textContent='Enter the 6-digit code sent to '+em+'.';say('Code sent. It expires in 10 minutes.');code.focus()}).catch(function(err){say(err&&err.status===429?'Too many attempts. Try again in a moment.':(err&&err.message)||'Could not send the code. Check the email address and try again.',true)}).then(function(){submit.disabled=false});return}A.verifyCode({email:email.value.trim(),code:code.value.trim()}).then(function(d){if(d&&d.user)finish();else say('That code did not work. Try again.',true)}).catch(function(err){say((err&&err.message)||'That code did not work. Try again.',true)}).then(function(){submit.disabled=false})};
  add.onclick=function(){add.disabled=true;skip.disabled=true;A.registerPasskey().then(function(r){if(!r)decline();go()}).catch(function(err){add.disabled=false;skip.disabled=false;say((err&&err.message)||'Could not save the passkey. You can continue without one.',true)})};
  skip.onclick=function(){decline();go()};email.focus();
})();
</script></body></html>
