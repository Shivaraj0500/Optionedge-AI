<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · OptionEdge AI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071019;color:#eaf2f8;font:15px Inter,system-ui,sans-serif;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));padding:34px;border:1px solid #203140;border-radius:22px;background:#0b1621;box-shadow:0 24px 70px #0008}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6ee7b7,#38bdf8);display:grid;place-items:center;color:#041016;font-weight:900;font-size:21px}.eyebrow{margin:22px 0 7px;color:#6ee7b7;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 9px;font-size:29px}p{color:#8fa5b7;line-height:1.6}.field{margin-top:22px}label{display:block;margin-bottom:8px;color:#b9c8d4;font-size:12px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #294052;border-radius:12px;background:#071019;color:#fff;outline:none}input:focus{border-color:#6ee7b7}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#6ee7b7;color:#041016;font-weight:850;cursor:pointer}.muted{font-size:12px}.error{color:#fca5a5;min-height:20px;margin-top:12px}.code{display:none}.back{display:block;margin-top:18px;text-align:center;color:#71879a;text-decoration:none;font-size:12px}</style></head><body><main class="card"><div class="mark">O</div><div class="eyebrow">OptionEdge AI</div><h1>Sign in to your terminal</h1><p>Use your email to receive a secure one-time verification code. No password is required.</p><form id="emailForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><button>Send verification code</button></form><form id="codeForm" class="code"><div class="field"><label>Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code"></div><button>Verify and continue</button></form><div id="error" class="error"></div><a class="back" href="/">← Back to OptionEdge AI</a></main><script>const A=window.hatchable?.auth;const qs=new URLSearchParams(location.search);const next=qs.get('next')||'/';const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'/';const emailForm=document.querySelector('#emailForm'),codeForm=document.querySelector('#codeForm'),email=document.querySelector('#email'),code=document.querySelector('#code'),error=document.querySelector('#error');let address='';async function init(){if(!A){error.textContent='Authentication is unavailable. Please reload.';return}try{const s=await A.getSession();if(s?.user)location.href=safeNext}catch{}}emailForm.onsubmit=async e=>{e.preventDefault();error.textContent='';address=email.value.trim();try{await A.startLogin(address);emailForm.style.display='none';codeForm.style.display='block';code.focus()}catch(err){error.textContent=err?.message||'Could not send the verification code.'}};codeForm.onsubmit=async e=>{e.preventDefault();error.textContent='';try{await A.verifyCode(address,code.value.trim());location.href=safeNext}catch(err){error.textContent=err?.message||'The code could not be verified.'}};init();</script></body></html>
